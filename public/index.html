<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Puzzles">
  <meta name="theme-color" content="#f6f1e7">
  <title>Puzzle Table</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Library -->
  <section id="screen-library" class="screen scroll wood" hidden>
    <header class="hero">
      <div class="hero-pieces" aria-hidden="true">
        <svg class="fp fp1" viewBox="15 15 70 70"><path d="M30 30 H44 C40 16 60 16 56 30 H70 V44 C84 40 84 60 70 56 V70 H56 C60 84 40 84 44 70 H30 V56 C40 60 40 40 30 44 Z"/></svg>
        <svg class="fp fp2" viewBox="15 15 70 70"><path d="M30 30 H44 C40 16 60 16 56 30 H70 V44 C84 40 84 60 70 56 V70 H56 C60 84 40 84 44 70 H30 V56 C40 60 40 40 30 44 Z"/></svg>
        <svg class="fp fp3" viewBox="15 15 70 70"><path d="M30 30 H44 C40 16 60 16 56 30 H70 V44 C84 40 84 60 70 56 V70 H56 C60 84 40 84 44 70 H30 V56 C40 60 40 40 30 44 Z"/></svg>
        <svg class="fp fp4" viewBox="15 15 70 70"><path d="M30 30 H44 C40 16 60 16 56 30 H70 V44 C84 40 84 60 70 56 V70 H56 C60 84 40 84 44 70 H30 V56 C40 60 40 40 30 44 Z"/></svg>
        <svg class="fp fp5" viewBox="15 15 70 70"><path d="M30 30 H44 C40 16 60 16 56 30 H70 V44 C84 40 84 60 70 56 V70 H56 C60 84 40 84 44 70 H30 V56 C40 60 40 40 30 44 Z"/></svg>
      </div>
      <button id="cloud-status" class="cloud-pill" type="button" hidden></button>
      <p id="greeting" class="eyebrow"></p>
      <h1>Puzzle Table</h1>
      <p class="hero-sub">Turn any photo into a jigsaw.</p>
      <div id="stats" class="stats"></div>
      <a id="hero-cta" class="primary hero-cta" href="#/new" hidden>Make your first puzzle</a>
    </header>
    <section id="continue" class="continue" hidden></section>
    <h2 id="library-heading" class="section-title" hidden>Your puzzles</h2>
    <div id="library-grid" class="lib-grid"></div>
  </section>

  <!-- New puzzle -->
  <section id="screen-new" class="screen scroll wood" hidden>
    <header class="bar new-bar">
      <a class="icon-btn" href="#/" aria-label="Back to library">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <h2>New puzzle</h2>
    </header>
    <div class="new-body">
      <label id="photo-drop" class="photo-drop">
        <input type="file" id="photo-input" accept="image/*" hidden>
        <span class="drop-pieces" aria-hidden="true">
          <svg class="dp dp1" viewBox="15 15 70 70"><path d="M30 30 H44 C40 16 60 16 56 30 H70 V44 C84 40 84 60 70 56 V70 H56 C60 84 40 84 44 70 H30 V56 C40 60 40 40 30 44 Z"/></svg>
          <svg class="dp dp2" viewBox="15 15 70 70"><path d="M30 30 H44 C40 16 60 16 56 30 H70 V44 C84 40 84 60 70 56 V70 H56 C60 84 40 84 44 70 H30 V56 C40 60 40 40 30 44 Z"/></svg>
          <svg class="dp dp3" viewBox="15 15 70 70"><path d="M30 30 H44 C40 16 60 16 56 30 H70 V44 C84 40 84 60 70 56 V70 H56 C60 84 40 84 44 70 H30 V56 C40 60 40 40 30 44 Z"/></svg>
        </span>
        <strong>Choose a photo</strong>
        <span class="drop-sub">A favourite memory, a pet, a place you love…</span>
        <span class="drop-btn">Browse photos</span>
      </label>
      <div id="preview-wrap" class="preview-wrap" hidden>
        <canvas id="preview-canvas"></canvas>
        <button id="change-photo" class="link-btn" type="button">Choose a different photo</button>
      </div>
      <div id="new-options" class="panel" hidden>
        <div class="field">
          <div class="label">How many pieces?</div>
          <div id="count-chips" class="chips"></div>
          <div id="count-detail" class="small detail"></div>
        </div>
        <div class="field">
          <label class="switch-row" for="rotate-input">
            <span>
              <strong>Rotate pieces</strong>
              <span class="small detail">Harder: pieces start turned. Tap a piece to turn it.</span>
            </span>
            <input type="checkbox" id="rotate-input" class="switch">
          </label>
        </div>
        <div class="field">
          <label class="label" for="name-input">Name</label>
          <input id="name-input" class="text" maxlength="60" autocomplete="off">
        </div>
      </div>
      <p id="new-error" class="error"></p>
      <button id="start-btn" class="primary" type="button" disabled hidden>Start puzzle</button>
    </div>
  </section>

  <!-- Play -->
  <section id="screen-play" class="screen play" hidden>
    <header class="bar play-bar">
      <a class="icon-btn" href="#/" aria-label="Back to library">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <div class="play-info">
        <div id="play-title" class="play-title"></div>
        <div class="play-sub"><span id="play-progress"></span> · <span id="play-time"></span><span id="play-cloud" class="cloud-mini"></span></div>
      </div>
      <button id="btn-ghost" class="icon-btn toggle" type="button" title="Show picture on the board" aria-label="Show picture on the board">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 8"/></svg>
      </button>
      <button id="btn-edges" class="icon-btn toggle" type="button" title="Only show edge pieces in the tray" aria-label="Edge pieces only">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="1.5"/><rect x="9" y="9" width="6" height="6" rx="0.5" stroke-dasharray="2 2" opacity="0.6"/></svg>
      </button>
      <button id="btn-fit" class="icon-btn" type="button" title="Fit board to screen" aria-label="Fit board to screen">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
      <button id="btn-menu" class="icon-btn" type="button" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
      </button>
      <div id="menu" class="menu" hidden>
        <div class="label">Table</div>
        <div id="swatches" class="swatches"></div>
        <label class="label" for="tray-size">Tray piece size</label>
        <div class="slider-row">
          <span class="slider-sm">A</span>
          <input type="range" id="tray-size" min="0.7" max="1.8" step="0.05">
          <span class="slider-lg">A</span>
        </div>
        <button id="btn-sound" class="menu-item" type="button">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 010 7"/></svg>
          <span>Sound on</span>
        </button>
      </div>
    </header>
    <div class="play-area">
      <canvas id="board"></canvas>
      <div class="zoom-ctl">
        <button id="btn-zoom-in" class="icon-btn" type="button" aria-label="Zoom in">+</button>
        <button id="btn-zoom-out" class="icon-btn" type="button" aria-label="Zoom out">−</button>
      </div>
      <div class="table-tools">
        <button id="btn-pieces" class="tool-pill" type="button" aria-label="See all pieces in the tray">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>
          <span>Pieces</span>
        </button>
        <button id="btn-select" class="tool-pill" type="button" aria-label="Select several pieces to move together">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h4M12 4h4M20 4v4M20 12v4M4 8v4M4 16v4h4M12 20h4"/><path d="M13 13l7 3-3 1-1 3z" fill="currentColor"/></svg>
          <span>Select</span>
        </button>
        <button id="btn-tidy" class="tool-pill" type="button" aria-label="Send loose pieces back to the tray">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v11M7.5 9.5L12 14l4.5-4.5"/><path d="M4 15v4a1 1 0 001 1h14a1 1 0 001-1v-4"/></svg>
          <span>Tidy</span>
        </button>
      </div>
      <button id="tray-sort" class="tray-sort" type="button" aria-label="Sort the tray by colour"></button>
      <div id="select-hint" class="select-hint" hidden>
        <span id="select-text"></span>
        <button id="select-done" type="button">Done</button>
      </div>
      <div id="toast" class="toast" hidden></div>
      <div id="play-loading" class="loading" hidden>Cutting pieces…</div>
    </div>
    <div id="pieces-panel" class="pieces-panel" hidden>
      <header class="bar pieces-bar">
        <button id="pieces-close" class="icon-btn" type="button" aria-label="Close">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
        <div id="pieces-title" class="play-title"></div>
      </header>
      <div class="pieces-tools">
        <div class="seg">
          <button id="sort-mixed" type="button">Mixed</button>
          <button id="sort-colour" type="button">By colour</button>
        </div>
        <button id="pieces-edges" class="pill" type="button">Edges</button>
        <input id="pieces-size" type="range" min="60" max="170" step="2" aria-label="Piece size">
      </div>
      <div id="pieces-scroll" class="pieces-scroll">
        <canvas id="pieces-canvas"></canvas>
        <div id="pieces-spacer"></div>
      </div>
      <footer class="pieces-foot">
        <button id="pieces-clear" class="secondary" type="button" hidden>Clear</button>
        <button id="pieces-place" class="primary" type="button" disabled>Tap pieces to select</button>
      </footer>
    </div>
    <div id="conflict" class="conflict" hidden>
      <div class="conflict-card">
        <strong>Newer progress on another device</strong>
        <p>This puzzle was saved more recently somewhere else.</p>
        <div class="conflict-actions">
          <button id="conflict-keep" class="secondary" type="button">Keep this one</button>
          <button id="conflict-load" class="primary" type="button">Load latest</button>
        </div>
      </div>
    </div>
    <div id="complete" class="complete" hidden>
      <div id="confetti" class="confetti"></div>
      <div class="complete-card">
        <img id="complete-img" alt="">
        <h2>Puzzle complete!</h2>
        <p id="complete-stats" class="muted"></p>
        <div class="complete-actions">
          <button id="complete-close" class="secondary" type="button">Admire it</button>
          <a class="primary" href="#/">Library</a>
        </div>
      </div>
    </div>
  </section>

  <script type="module" src="js/main.js"></script>
</body>
</html>
